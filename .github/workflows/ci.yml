name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsched
          POSTGRES_PASSWORD: jobsched
          POSTGRES_DB: jobsched_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsched"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://jobsched:jobsched@localhost:5432/jobsched_test
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # No --ignore-vuln flags on purpose. The ones that used to be here
          # covered unfixable pyasn1/ecdsa advisories pulled in by
          # python-jose; that dependency was replaced with PyJWT instead
          # (see docs/DESIGN_DECISIONS.md), so any finding now is a real,
          # actionable one and should fail the build.
          pip-audit -r requirements.txt

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest -v --cov=app --cov=worker --cov=scheduler --cov-report=term-missing
