name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codity
          POSTGRES_PASSWORD: codity
          POSTGRES_DB: codity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://codity:codity@localhost:5432/codity_test
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # PYSEC-2026-1325 (ecdsa) and CVE-2026-30922 (pyasn1) are transitive
          # deps of python-jose with no available fix compatible with the
          # pin python-jose itself requires (see docs/DESIGN_DECISIONS.md) --
          # ignored here so CI still fails on any *new* vulnerability.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-30922

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest -v --cov=app --cov=worker --cov=scheduler --cov-report=term-missing
