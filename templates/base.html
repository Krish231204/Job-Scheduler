<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Scheduler{% endblock %} · Job Scheduler</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Apply the saved theme before first paint to avoid a flash of the
        // wrong mode. No saved choice = follow the OS preference (no stamp).
        (function () {
            try {
                var saved = localStorage.getItem("jobsched-theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.dataset.theme = saved;
                }
            } catch (e) { /* storage unavailable -- OS preference applies */ }
        })();
    </script>
    <script src="/static/live.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/dashboard">jobsched<span class="brand-dot">●</span></a>
        <nav>
            <a href="/dashboard">Projects</a>
            <a href="/dashboard/watches">Watches</a>
            <a href="/dashboard/workers">Workers</a>
        </nav>
        <div class="topbar-actions">
            <button type="button" class="theme-toggle" onclick="toggleTheme()"
                    aria-label="Switch color theme" title="Switch color theme">
                <span class="icon-moon">☾</span><span class="icon-sun">☀</span>
            </button>
            {% if user %}
            <form method="post" action="/logout" class="logout-form">
                <span class="muted user-email">{{ user.email }}</span>
                <span class="muted" title="All dashboard times are shown in this zone">{{ display_tz }}</span>
                <button type="submit" class="button-secondary button-small">Log out</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
        function toggleTheme() {
            var root = document.documentElement;
            var current = root.dataset.theme ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            var next = current === "dark" ? "light" : "dark";
            root.dataset.theme = next;
            try { localStorage.setItem("jobsched-theme", next); } catch (e) { /* fine */ }
            document.dispatchEvent(new CustomEvent("themechange"));
        }
    </script>
</body>
</html>
