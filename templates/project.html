{% extends "base.html" %}
{% block title %}{{ project.name }}{% endblock %}
{% block content %}
<a class="breadcrumb" href="/dashboard">&larr; <span>Back to projects</span></a>
<h1>{{ project.name }}</h1>
{% if project.description %}<p class="muted">{{ project.description }}</p>{% endif %}

<div id="queues-live">
{% include "_project_queues_fragment.html" %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    connectLive("/ws/projects/{{ project.id }}", "queues-live");
});
</script>
{% endblock %}
