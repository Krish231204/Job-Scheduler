version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codity
      POSTGRES_PASSWORD: codity
      POSTGRES_DB: codity
    ports:
      - "5432:5432"
    volumes:
      - codity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codity"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://codity:codity@db:5432/codity
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://codity:codity@db:5432/codity
      # ENVIRONMENT is intentionally left unset (defaults to "development")
      # in this local/grading compose file, so this insecure default secret
      # is accepted. app/main.py refuses to boot with this value if
      # ENVIRONMENT=production is set -- that's what protects a real deploy.
      JWT_SECRET: change-me-in-production
      # Optional -- enables real AI-generated dead-letter failure summaries.
      # Unset by default (falls back to a rule-based summary, no key needed).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "worker.main", "--concurrency", "8"]
    environment:
      DATABASE_URL: postgresql+asyncpg://codity:codity@db:5432/codity
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Scale with: docker compose up --scale worker=3
    # (deploy.replicas is a Swarm-only directive and is ignored by plain
    # `docker compose up`, so we don't rely on it here.)

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://codity:codity@db:5432/codity
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  codity_pgdata:
